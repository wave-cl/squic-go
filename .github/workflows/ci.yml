name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race is not optional here. The cookie-secret rotation bug fixed in
      # v0.59.5 was a genuine data race between the rotation goroutine and the
      # verification path, and the race detector is what catches that class.
      - name: Test
        run: go test -race ./...
