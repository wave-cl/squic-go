name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race is not optional here. The cookie-secret rotation bug fixed in
      # v0.59.5 was a genuine data race between the rotation goroutine and the
      # verification path, and the race detector is what catches that class.
      - name: Test
        run: go test -race ./...

  cross-impl:
    name: Cross-implementation tests
    runs-on: ubuntu-latest
    steps:
      # Both repos into sibling subdirs so the harness's default
      # SQUIC_RUST_DIR (../squic-rust relative to squic-go) resolves.
      - uses: actions/checkout@v4
        with:
          path: squic-go
      - uses: actions/checkout@v4
        with:
          repository: wave-cl/squic-rust
          path: squic-rust

      - uses: actions/setup-go@v5
        with:
          go-version-file: squic-go/go.mod
          cache: true
          cache-dependency-path: squic-go/go.sum

      # squic-rust/rust-toolchain.toml pins the version; cargo auto-installs it.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: squic-rust

      # Covers the SIP-2 peer key and the SIP-3 peer identity, advertised and
      # anonymous, across the Rust x Go matrix. NOTE: this checks out the
      # sibling repo's default branch, so during a wire flag-day (SIP-3) it
      # fails until BOTH mains carry the change — re-run after the second push.
      - name: Cross-implementation peer-key / peer-identity test
        run: bash squic-go/scripts/cross_peerkey_test.sh

      # Covers the SIP-7 cookie defence across the same matrix: the cookie
      # value, the cookie-reply key, the reply packet and the MAC2 boundary.
      # These are four constructions both ends must compute identically and,
      # until this ran, each had only ever been checked against itself.
      - name: Cross-implementation cookie test
        run: bash squic-go/scripts/cross_cookie_test.sh
