name: CI

on:
  push:
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No module cache: nothing is downloaded, built or tested here. gofmt
      # only parses.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # Two things this job must get right, both of which a shorter version
      # gets wrong.
      #
      # `gofmt -l` exits **0 whether or not anything is unformatted** — it
      # reports by listing filenames, not by its status. So the obvious step,
      # `run: gofmt -l .`, is green on every possible input: it would print the
      # offending files and pass anyway. Verified by appending a deliberately
      # mangled function and watching `gofmt -l .` name the file and still exit
      # 0. The check therefore has to be on the output.
      #
      # And `-s` is deliberately not enforced. It rewrites code rather than
      # layout — dropping redundant types from composite literals, shortening
      # slice expressions — which is a separate decision from formatting, the
      # same reason clippy and rustfmt are separate jobs on the Rust side. It
      # currently reports nothing anyway.
      #
      # Nothing here needs the scoping that every Rust fmt job in this estate
      # carries: gofmt walks file paths rather than a dependency graph, and
      # this module has no `replace` directives and no vendor tree, so there is
      # no way for it to reach another repository.
      - name: Format
        run: |
          total=$(find . -name '*.go' -not -path './.git/*' | wc -l | tr -d ' ')
          test "$total" -gt 0
          echo "checking $total .go files"
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::not gofmt-clean:"
            echo "$out"
            exit 1
          fi
          echo "all $total files are gofmt-clean"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race is not optional here. The cookie-secret rotation bug fixed in
      # v0.59.5 was a genuine data race between the rotation goroutine and the
      # verification path, and the race detector is what catches that class.
      - name: Test
        run: go test -race ./...

  cross-impl:
    name: Cross-implementation tests
    runs-on: ubuntu-latest
    steps:
      # Both repos into sibling subdirs so the harness's default
      # SQUIC_RUST_DIR (../squic-rust relative to squic-go) resolves.
      - uses: actions/checkout@v4
        with:
          path: squic-go
      - uses: actions/checkout@v4
        with:
          repository: wave-cl/squic-rust
          path: squic-rust

      - uses: actions/setup-go@v5
        with:
          go-version-file: squic-go/go.mod
          cache: true
          cache-dependency-path: squic-go/go.sum

      # squic-rust/rust-toolchain.toml pins the version; cargo auto-installs it.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: squic-rust

      # Covers the SIP-2 peer key and the SIP-3 peer identity, advertised and
      # anonymous, across the Rust x Go matrix. NOTE: this checks out the
      # sibling repo's default branch, so during a wire flag-day (SIP-3) it
      # fails until BOTH mains carry the change — re-run after the second push.
      - name: Cross-implementation peer-key / peer-identity test
        run: bash squic-go/scripts/cross_peerkey_test.sh

      # Covers the SIP-7 cookie defence across the same matrix: the cookie
      # value, the cookie-reply key, the reply packet and the MAC2 boundary.
      # These are four constructions both ends must compute identically and,
      # until this ran, each had only ever been checked against itself.
      - name: Cross-implementation cookie test
        run: bash squic-go/scripts/cross_cookie_test.sh
